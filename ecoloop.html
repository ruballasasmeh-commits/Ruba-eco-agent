<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoLoop — sustainability agent</title>
<meta name="description" content="EcoLoop helps you recycle, downcycle and upcycle everyday items safely, in English and Arabic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#173F25; --forest-2:#235A35; --sprout:#A8D5A2;
  --bg:#EEF5EE; --card:#FFFFFF; --tile:#F3F8F4; --tile-on:#E3F0E6; --mist:#EEF5EE;
  --ink:#13261A; --muted:#4A6151; --line:#CFE1D1; --line-strong:#9CC2A3;
  --accent:#2E7A3E; --accent-hover:#235A35; --on-accent:#FFFFFF; --accent-text:#2B7139;
  --warn-bg:#FFF4D6; --warn-ink:#6E4300; --danger-bg:#FDEBEA; --danger-ink:#8E1F17; --info-ink:#1F5A8A;
  --header:#173F25; --header-ink:#FFFFFF; --header-muted:#C9E6CC;
  --heat0:#E2EBE3; --heat1:#B5DDB9; --heat2:#7CC387; --heat3:#3E9A50; --heat4:#1F6B31;
  --font:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[lang="ar"]{--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;--head:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1D13; --card:#14291B; --tile:#173120; --tile-on:#204530; --mist:#1A3624;
    --ink:#E8F3E9; --muted:#AFC9B4; --line:#2C4D37; --line-strong:#4D7A5A;
    --accent:#86D293; --accent-hover:#A6E2AF; --on-accent:#0B1A10; --accent-text:#93DA9F;
    --warn-bg:#3A2E10; --warn-ink:#F7D88F; --danger-bg:#3F1A17; --danger-ink:#FFB4AC; --info-ink:#9CCBF2;
    --header:#0A1B10; --header-muted:#B3D6B8;
    --heat0:#1E3726; --heat1:#2D5B3A; --heat2:#3F8250; --heat3:#5FB06F; --heat4:#93DA9F;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1D13; --card:#14291B; --tile:#173120; --tile-on:#204530; --mist:#1A3624;
  --ink:#E8F3E9; --muted:#AFC9B4; --line:#2C4D37; --line-strong:#4D7A5A;
  --accent:#86D293; --accent-hover:#A6E2AF; --on-accent:#0B1A10; --accent-text:#93DA9F;
  --warn-bg:#3A2E10; --warn-ink:#F7D88F; --danger-bg:#3F1A17; --danger-ink:#FFB4AC; --info-ink:#9CCBF2;
  --header:#0A1B10; --header-muted:#B3D6B8;
  --heat0:#1E3726; --heat1:#2D5B3A; --heat2:#3F8250; --heat3:#5FB06F; --heat4:#93DA9F;
}
/* High contrast */
:root[data-contrast="high"]{--bg:#FFFFFF;--card:#FFFFFF;--tile:#FFFFFF;--tile-on:#DFF2E2;--ink:#000;--muted:#1F1F1F;--line:#1B3A24;--line-strong:#000;--accent:#0F4A1F;--accent-hover:#000;--accent-text:#0F4A1F;--header:#000;--warn-ink:#4A2C00;--danger-ink:#6B0F08}
@media (prefers-color-scheme: dark){:root[data-contrast="high"]:not([data-theme="light"]){--bg:#000;--card:#000;--tile:#000;--tile-on:#12361C;--ink:#FFF;--muted:#F0F0F0;--line:#FFF;--line-strong:#FFF;--accent:#A6F0B1;--accent-hover:#FFF;--on-accent:#000;--accent-text:#A6F0B1;--header:#000;--warn-bg:#2A1F00;--warn-ink:#FFE08A;--danger-bg:#2A0000;--danger-ink:#FFC2BA}}
:root[data-contrast="high"][data-theme="dark"]{--bg:#000;--card:#000;--tile:#000;--tile-on:#12361C;--ink:#FFF;--muted:#F0F0F0;--line:#FFF;--line-strong:#FFF;--accent:#A6F0B1;--accent-hover:#FFF;--on-accent:#000;--accent-text:#A6F0B1;--header:#000;--warn-bg:#2A1F00;--warn-ink:#FFE08A;--danger-bg:#2A0000;--danger-ink:#FFC2BA}
:root[data-contrast="high"] .mat,:root[data-contrast="high"] .panel,:root[data-contrast="high"] .card{border-width:2px}

html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
:root[data-spacing="wide"] body{word-spacing:.16em;line-height:1.85}
:root[data-spacing="wide"]:lang(en) body{letter-spacing:.04em}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
img,svg{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:50;background:var(--card);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:700;border:2px solid var(--accent)}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}
.emo{font-family:var(--emoji);line-height:1;font-style:normal}

/* Header */
.top{background:var(--header);color:var(--header-ink);padding:16px 20px 76px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto -10% -1px -10%;height:48px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.wrap{max-width:1100px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem var(--head);margin-inline-end:auto}
.brand svg{width:30px;height:30px}
.hbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-weight:700}
.hbtn:hover{background:rgba(255,255,255,.18)}
.hbtn .emo{font-size:1.1rem}
nav.tabs{display:flex;gap:6px;margin-top:18px;background:rgba(255,255,255,.08);border-radius:999px;padding:5px;width:max-content;max-width:100%}
nav.tabs button{border:0;background:transparent;color:#fff;border-radius:999px;padding:9px 18px;min-height:44px;font-weight:700}
nav.tabs button[aria-current="page"]{background:#fff;color:#173F25}
h1{font:800 clamp(2rem,5.5vw,3.3rem)/1.08 var(--head);margin:22px 0 10px;max-width:17ch;letter-spacing:-.015em}
:root[lang="ar"] h1{letter-spacing:0;line-height:1.3}
.lede{max-width:58ch;color:var(--header-muted);margin:0 0 22px}
.search{display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px;max-width:700px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 14px;color:#13261A;font-size:1.02rem}
.search input::placeholder{color:#5D7363}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px var(--sprout),0 10px 30px rgba(0,0,0,.2)}
.btn{border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;background:var(--accent);color:var(--on-accent);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.top .btn{background:#2E7A3E;color:#fff}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:transparent;color:var(--accent-text);border:2px solid var(--accent)}
.btn.ghost:hover{background:var(--tile-on)}
.hint{font-size:.9rem;color:var(--header-muted);margin:10px 4px 0}

main{padding:0 20px 50px;margin-top:-34px;position:relative;z-index:1}
h2{font:700 1.4rem/1.3 var(--head);margin:0 0 14px}
h3{font-family:var(--head)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,30px)}
.muted{color:var(--muted)}

/* Material grid */
.grid-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0;margin:0;list-style:none}
@media (min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.mat{width:100%;height:100%;background:var(--tile);border:2px solid var(--line);border-radius:18px;padding:18px 8px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;transition:border-color .15s,background .15s;min-height:120px}
.mat:hover{border-color:var(--accent)}
.mat[aria-pressed="true"]{border-color:var(--accent);background:var(--tile-on);box-shadow:inset 0 0 0 1px var(--accent)}
.mat .emo{font-size:2.3rem}
.mat .lbl{font-size:1rem;line-height:1.3}
.new{font-size:.72rem;font-weight:700;color:var(--accent-text);border:1.5px solid var(--accent);border-radius:999px;padding:0 8px}
@media (max-width:420px){.grid{gap:10px}.mat{padding:14px 4px;min-height:108px}.mat .lbl{font-size:.9rem}}

/* Result */
#result{margin-top:30px;scroll-margin-top:12px}
.res-head{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.res-head .ic{flex:none;width:68px;height:68px;border-radius:18px;background:var(--tile);border:2px solid var(--line);display:grid;place-items:center;font-size:2.3rem}
.res-head h2{margin:0;font-size:1.7rem}
.res-head p{margin:2px 0 0;color:var(--muted)}
.res-head .grow{flex:1;min-width:200px}
.tag{display:inline-block;font:700 .78rem var(--font);background:var(--tile-on);color:var(--accent-text);border-radius:999px;padding:2px 10px;margin-inline-start:8px;vertical-align:middle}
.safety{border-radius:16px;padding:16px 18px;margin-bottom:24px;background:var(--warn-bg);color:var(--warn-ink);border:1.5px solid color-mix(in srgb,var(--warn-ink) 30%,transparent)}
.safety h3{margin:0 0 8px;font-size:1.1rem;display:flex;gap:8px;align-items:center}
.safety ul{margin:0;padding:0;list-style:none}
.safety li{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.lvl{flex:none;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;margin-top:2px;border:1.5px solid currentColor;white-space:nowrap}
.lvl.h{color:var(--danger-ink);background:var(--danger-bg)}
.lvl.m{color:var(--warn-ink)}
.lvl.l{color:var(--info-ink)}
.cycle{display:grid;grid-template-columns:repeat(3,1fr);background:var(--tile);border:1.5px solid var(--line);border-radius:18px;padding:5px;margin-bottom:20px}
.cycle button{border:0;background:transparent;border-radius:14px;padding:10px 6px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cycle button b{font:700 1.02rem var(--head)}
.cycle button small{color:var(--muted);font-size:.78rem;text-align:center}
.cycle button[aria-selected="true"]{background:var(--forest);color:#fff}
.cycle button[aria-selected="true"] small{color:var(--sprout)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.method h3{font-size:1.2rem;margin:0 0 6px}
.method .sum{margin:0 0 12px;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 14px}
.steps li{counter-increment:s;position:relative;padding-block:9px;padding-inline-start:44px;border-bottom:1px dashed var(--line)}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:9px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 .9rem var(--font);display:grid;place-items:center}
.idea{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;background:var(--tile)}
.idea h4{margin:0 0 6px;font:700 1.05rem var(--head)}
.guide{border-top:1.5px solid var(--line);padding-top:12px;margin-top:4px}
.guide p{margin:0 0 8px;font-size:.92rem}
.gbtns{display:flex;flex-wrap:wrap;gap:8px}
.gbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;border-radius:999px;padding:7px 15px;font-weight:700;font-size:.95rem;border:2px solid var(--accent);color:var(--accent-text);background:transparent}
.gbtn.best{background:var(--accent);color:var(--on-accent)}
.gbtn:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.gbtn small{font-weight:400;font-size:.75rem;opacity:.9}
.benefit{background:var(--forest);color:#fff;border-radius:20px;padding:20px;align-self:start}
:root[data-contrast="high"] .benefit{background:#000;border:2px solid #fff}
.benefit h3{font-size:1.15rem;margin:0 0 14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:rgba(255,255,255,.09);border-radius:14px;padding:12px}
.stat strong{display:block;font:800 1.35rem/1.15 var(--head);color:var(--sprout)}
.stat span{font-size:.86rem;color:#DCEEDD}
.benefit ul{margin:0;padding-inline-start:20px;color:#E9F5EA}
.benefit li{margin:6px 0}
.sdg{margin:12px 0 0;font-size:.86rem;color:#C9E6CC}
.logbox{margin-top:24px;border:2px dashed var(--line-strong);border-radius:18px;padding:16px}
.logbox h3{margin:0 0 10px;font-size:1.05rem}
.logbox .gbtns .btn{background:var(--tile-on);color:var(--accent-text);border:2px solid var(--accent)}
.logbox .gbtns .btn:hover{background:var(--accent);color:var(--on-accent)}
.ask{margin-top:24px;border-top:1.5px solid var(--line);padding-top:20px}
.ask h3{font-size:1.05rem;margin:0 0 10px}
.ask .search{box-shadow:none;border:1.5px solid var(--line);background:var(--card);max-width:none}
.ask .search input{color:var(--ink)}
.ask .search input::placeholder{color:var(--muted)}
.answer{white-space:pre-wrap;margin-top:12px;background:var(--tile);border-radius:14px;padding:14px 16px}
.status{display:flex;align-items:center;gap:10px;color:var(--muted);padding:16px 2px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.5);opacity:.4}}
.err{background:var(--danger-bg);color:var(--danger-ink);border-radius:14px;padding:12px 16px}

/* Dialogs */
dialog{border:0;padding:0;border-radius:24px;background:var(--card);color:var(--ink);width:min(780px,calc(100% - 20px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,20,10,.6)}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1.5px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dhead h2{margin:0;font-size:1.2rem;flex:1}
.x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--tile);font-size:1.3rem;display:grid;place-items:center}
.dbody{padding:18px 20px 22px}
.vtabs{display:flex;gap:6px;background:var(--tile);border:1.5px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px}
.vtabs button{flex:1;border:0;background:transparent;border-radius:999px;min-height:44px;font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.vtabs button[aria-selected="true"]{background:var(--forest);color:#fff}
.vtabs .rec{font-size:.7rem;font-weight:700;background:var(--sprout);color:#173F25;border-radius:999px;padding:1px 7px}
.stage{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(150deg,#1F5A33,#173F25 55%,#0F2C19);color:#fff;display:flex;flex-direction:column}
.bars{display:flex;gap:4px;padding:12px 14px 0}
.bars span{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.bars span i{display:block;height:100%;width:0;background:#fff}
.bars span.done i{width:100%}
.bars span.cur i{animation:fill var(--dur,5s) linear forwards;animation-play-state:var(--ps,paused)}
@keyframes fill{to{width:100%}}
.scene{flex:1;display:grid;place-items:center;position:relative;min-height:clamp(190px,34vw,280px);padding:10px 0 18px}
.scene .pair{position:relative;font-family:var(--emoji);line-height:1}
.scene .big{font-size:clamp(4rem,14vw,7rem);display:block}
.scene .act{position:absolute;inset-inline-end:-42%;bottom:-12%;font-size:clamp(2.2rem,7vw,3.4rem);background:#fff;border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.scene.pop .pair{animation:pop .45s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.cap{margin:0;padding:12px 18px 16px;background:rgba(0,0,0,.35);font-size:clamp(1rem,2.6vw,1.2rem);min-height:6.2em}
.cap b{display:block;font-size:.8rem;color:var(--sprout);letter-spacing:.03em}
.ctrls{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
.cbtn{min-width:48px;min-height:48px;border-radius:999px;border:2px solid var(--line-strong);background:var(--tile);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-weight:700}
.cbtn.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-width:110px}
.cbtn[aria-pressed="true"]{background:var(--tile-on);border-color:var(--accent);color:var(--accent-text)}
.vnote{font-size:.88rem;color:var(--muted);text-align:center;margin:10px 0 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:0;padding:0;list-style:none}
.photo{margin:0;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:var(--tile)}
.photo .pic{aspect-ratio:4/3;display:grid;place-items:center;position:relative;background:linear-gradient(140deg,var(--g1),var(--g2))}
.photo .pic .pair{position:relative;font-family:var(--emoji);line-height:1}
.photo .pic .big{font-size:3.6rem;display:block}
.photo .pic .act{position:absolute;inset-inline-end:-26px;bottom:-10px;font-size:1.7rem;background:#fff;border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.photo .num{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:.85rem;border-radius:999px;padding:2px 10px}
.photo figcaption{padding:12px 14px;font-size:.98rem}
.readv h3{margin:0 0 4px;font-size:1.3rem}
.readv .safety{margin:14px 0}
.tipbox{background:var(--tile);border-inline-start:5px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:14px}
.setgrp{border:0;margin:0 0 18px;padding:0}
.setgrp legend{font:700 1.02rem var(--head);margin-bottom:8px;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line-strong);background:var(--tile);font-weight:700}
.seg input:checked + span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:3px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:color-mix(in srgb,var(--ink) 22%,transparent);border:2px solid color-mix(in srgb,var(--ink) 35%,transparent);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:1px;inset-inline-start:1px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{inset-inline-start:23px;background:var(--on-accent)}

/* Tracker */
.tgrid{display:grid;gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.card .v{font:800 1.9rem/1.1 var(--head);color:var(--accent-text);display:flex;align-items:center;gap:6px}
.card .k{color:var(--muted);font-size:.92rem}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.weeknav .lbl{font-weight:700;margin-inline:6px;flex:1}
.tscroll{overflow-x:auto;border:1.5px solid var(--line);border-radius:16px}
table.habits{border-collapse:collapse;width:100%;min-width:620px}
.habits th,.habits td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
.habits thead th{font-size:.82rem;color:var(--muted);font-weight:700;background:var(--tile);position:sticky;top:0}
.habits thead th.today{color:var(--accent-text)}
.habits th[scope="row"]{text-align:start;font-weight:700;padding-inline-start:14px;min-width:180px;background:var(--card);position:sticky;inset-inline-start:0;z-index:1}
.habits tr:last-child th,.habits tr:last-child td{border-bottom:0}
.hrow{display:flex;align-items:center;gap:8px}
.hrow .emo{font-size:1.2rem}
.delh{margin-inline-start:auto;border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:50%;font-size:1.1rem}
.delh:hover{background:var(--danger-bg);color:var(--danger-ink)}
.chk{display:inline-grid;place-items:center;position:relative;width:44px;height:44px;cursor:pointer}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chk span{width:28px;height:28px;border-radius:8px;border:2px solid var(--line-strong);background:var(--card);display:grid;place-items:center;font-weight:800;color:transparent;transition:background .12s}
.chk input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk input:checked + span::after{content:"✓"}
.chk input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.chk input:disabled + span{opacity:.35}
td.today{background:var(--tile)}
.prog{display:flex;align-items:center;gap:8px;min-width:90px}
.prog .b{flex:1;height:8px;border-radius:4px;background:var(--heat0);overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--accent)}
.prog small{font-weight:700;min-width:2.5em}
.addh{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addh input{flex:1;min-width:200px;border:1.5px solid var(--line-strong);border-radius:999px;padding:10px 16px;background:var(--card);min-height:44px}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;max-width:420px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--heat0)}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--heat3)}.heat i.l4{background:var(--heat4)}
.heat i.t{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.mbar{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;margin:8px 0}
.mbar .b{height:14px;border-radius:7px;background:var(--heat0);overflow:hidden}
.mbar .b i{display:block;height:100%;background:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;list-style:none;padding:0;margin:0}
.badge{border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:var(--tile)}
.badge .emo{font-size:2rem;display:block;margin-bottom:4px}
.badge b{display:block}
.badge small{color:var(--muted);display:block}
.badge.off{opacity:.55;filter:grayscale(1)}
.badge .st{font-size:.75rem;font-weight:700;margin-top:6px;display:inline-block;border-radius:999px;padding:1px 8px;border:1.5px solid currentColor}
.loglist{list-style:none;padding:0;margin:0}
.loglist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.loglist .emo{font-size:1.6rem}
.loglist .meta{flex:1}
.loglist small{color:var(--muted);display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.linkbtn{background:none;border:0;color:var(--danger-ink);text-decoration:underline;font-weight:700;padding:10px 0;min-height:44px}
.tgrid>*,.two>*,.cols>*,.panel{min-width:0}
@media (max-width:520px){.safety li{flex-direction:column;gap:4px}.vtabs .rec{font-size:0;padding:0 5px}.vtabs .rec::before{content:"★";font-size:.8rem}.vtabs button{font-size:.92rem}}
.reading{outline:4px solid #F5B700!important;outline-offset:4px;border-radius:8px;background:color-mix(in srgb,#F5B700 14%,transparent)}
.readerbar{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  background:var(--card);border-top:2px solid var(--accent);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.15)}
.readerbar[hidden]{display:none}
.readerbar .rb-text{font-weight:700;flex:1 1 220px;text-align:center}
.readerbar .btn{min-height:44px;padding:8px 14px;font-size:.92rem}
@media (max-width:520px){.readerbar .rb-text{flex-basis:100%;font-size:.9rem}}
body.has-reader{padding-bottom:110px}
footer{color:var(--muted);font-size:.86rem;text-align:center;padding:10px 20px 30px}
/* ===== QUIZ & PLAY ===== */
.qwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.qwrap{grid-template-columns:1fr}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qkind{font:700 .8rem var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text)}
:root[lang="ar"] .qkind{letter-spacing:0;text-transform:none}
.qprompt{font:700 clamp(1.15rem,2.6vw,1.45rem)/1.35 var(--head);margin:0 0 10px}
.qfact{background:var(--tile);border:1.5px dashed var(--line-strong);border-radius:14px;padding:12px 16px;margin:0 0 16px;font-size:1.05rem}
.qfact b{color:var(--accent-text)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;list-style:none;padding:0;margin:0}
@media (max-width:560px){.qopts{grid-template-columns:1fr}}
.qopt{width:100%;min-height:76px;border:0;border-radius:16px;padding:14px 16px;font-weight:700;font-size:1.02rem;line-height:1.35;text-align:start;display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s,opacity .15s}
.qopt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 rgba(0,0,0,.22)}
.qopt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.qopt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28);font-size:.9rem}
.qopt.c0{background:#C2362F;color:#fff}.qopt.c1{background:#1E64B4;color:#fff}.qopt.c2{background:#F2B705;color:#1B1500}.qopt.c3{background:#1F7A38;color:#fff}
.qopt.c2 .k{background:rgba(0,0,0,.14)}
.qopt:disabled{cursor:default;opacity:.45}
.qopt.right{opacity:1;outline:4px solid var(--ink);outline-offset:3px}
.qopt.picked{opacity:1}
.qfb{margin-top:16px;border-radius:16px;padding:14px 16px;font-weight:700;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.qfb.ok{background:var(--tile-on);color:var(--accent-text);border:2px solid var(--accent)}
.qfb.no{background:var(--danger-bg);color:var(--danger-ink);border:2px solid currentColor}
.qfb .grow{flex:1 1 220px}
.qfb .grow small{display:block;font-weight:400;color:var(--ink);margin-top:4px}
.pop{display:inline-block;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.side{display:grid;gap:16px}
.shop{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.shop li{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--tile)}
.shop .top2{display:flex;gap:10px;align-items:center}
.shop .top2 .emo{font-size:1.6rem}
.shop b{display:block}
.shop small{color:var(--muted);display:block}
.pips{display:flex;gap:4px;margin:8px 0}
.pips i{flex:1;height:7px;border-radius:9px;background:var(--line)}
.pips i.on{background:var(--accent)}
.shop .btn{width:100%;min-height:44px}
.gamecard{background:linear-gradient(160deg,#173F25,#2E7A3E);color:#fff;border-radius:24px;padding:20px;border:0}
.gamecard h2{color:#fff;display:flex;gap:8px;align-items:center}
.gamecard p{color:#DCEEDD;margin:0 0 14px}
.gamecard .btn{background:#F2B705;color:#1B1500;width:100%;font-size:1.05rem}
.gamecard .btn:hover{background:#FFD24D}
.gamecard .btn:disabled{opacity:.55;cursor:not-allowed}
.gamecard .need{font-size:.9rem;color:#FFE08A;margin:10px 0 0}
.ghud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ghud .chip{background:var(--tile);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.ghud .grow{flex:1}
.arena{position:relative;height:clamp(250px,42vh,380px);border-radius:20px;overflow:hidden;border:2px solid var(--line-strong);
  background:linear-gradient(180deg,#CFE9F7 0%,#EAF6EC 75%,#B9DDB4 100%)}
:root[data-theme="dark"] .arena{background:linear-gradient(180deg,#10273A 0%,#14291B 75%,#1F4A2A 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .arena{background:linear-gradient(180deg,#10273A 0%,#14291B 75%,#1F4A2A 100%)}}
.arena .ground{position:absolute;inset-inline:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,#C2362F 0 18px,#F2B705 18px 36px)}
.fall{position:absolute;left:50%;top:0;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
.fall .emo{font-size:3rem;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.fall span:last-child{background:var(--card);color:var(--ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.95rem;border:1.5px solid var(--line-strong);white-space:nowrap}
.gmsg{position:absolute;inset-inline:12px;top:12px;text-align:center;font-weight:700;border-radius:12px;padding:6px 10px}
.gmsg.ok{background:var(--tile-on);color:var(--accent-text)}
.gmsg.no{background:var(--danger-bg);color:var(--danger-ink)}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media (max-width:560px){.bins{grid-template-columns:1fr 1fr}}
.bin{border:0;border-radius:16px 16px 12px 12px;padding:12px 6px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.bin:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.bin .emo{font-size:1.7rem}
.bin small{opacity:.85;font-weight:400}
.bin.rec{background:#1E64B4}.bin.comp{background:#1F7A38}.bin.haz{background:#C2362F}.bin.gen{background:#4A4F4C}
.gover{text-align:center;padding:10px 0}
.gover .big{font:800 3rem/1 var(--head);color:var(--accent-text);margin:6px 0}
.offnote{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:10px 14px;margin:0 0 16px;font-size:.95rem}
.keyrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.keyrow input{flex:1 1 220px;min-height:44px;border-radius:12px;border:2px solid var(--line-strong);background:var(--tile);padding:8px 12px}
.aimode{display:inline-block;font-weight:700;background:var(--tile-on);color:var(--accent-text);border-radius:999px;padding:4px 12px;margin-bottom:6px}

 ar:{n:"مناديل مستعملة",m:"ألياف ورقية قصيرة",k:"مناديل محارم فاين منشفة ورقية",
  s:[["m","المناديل المستعملة قد تحمل جراثيم، ضعها في كيس واغسل يديك."],["l","المناديل التي عليها مكياج أو مواد كيميائية أو استُخدمت أثناء المرض توضع في النفايات العامة."]],
  r:["المناديل لا تُدوَّر، فأليافها قصيرة جدًا وهي غير صحية.",["لا تضع المناديل في حاوية الورق.","سمّد النظيفة منها، وضع الباقي في كيس للنفايات العامة."]],
  d:["المناديل النظيفة (عليها ماء أو طعام فقط) مفيدة للسماد.",["مزّقها قطعًا صغيرة.","أضفها إلى السماد مع بقايا الطعام."]],
  u:[["استخدم مناديل قماشية",["قصّ قمصانًا قطنية قديمة إلى مربعات وخِط أطرافها.","اغسلها بماء ساخن بعد الاستخدام."]]],
  st:[["المحطة الأخيرة","المناديل هي آخر حياة للورق المدوَّر"],["قابلة للتسميد","المناديل النظيفة تعود إلى التربة"]],
  p:["تسميد المناديل النظيفة يتجنب ميثان المكبات.","البدائل القماشية تقلل الطلب على اللب الجديد.","شراء مناديل مدوَّرة يُبقي الورق قيد الاستخدام أطول."],g:"يدعم الهدف 15 للأمم المتحدة."}},

{id:"paint",e:"🎨",f:["text","video","photo"],
 en:{n:"Paint or chemicals",m:"Hazardous household waste",k:"paint chemicals solvent bleach cleaner oil pesticide thinner",
  s:[["h","Never pour paint, solvents or chemicals down drains or onto soil."],["h","Never mix chemicals — bleach and ammonia together make toxic gas."],["m","Keep products in their labelled containers with lids closed; work in fresh air."]],
  r:["Chemicals and oil-based paint go to a hazardous-waste site.",["Close containers tightly and keep the labels on.","Carry them upright in a box.","Drop at a hazardous-waste point; empty, dry metal tins can go in metal recycling."]],
  d:["Leftover water-based paint can be remixed into recycled paint.",["Give usable paint to schools, charities or paint-reuse schemes.","Let small amounts of water-based paint dry before disposal, if allowed."]],
  u:[["Use leftovers for small projects",["Paint planters, birdhouses or old furniture.","Share leftover tins with neighbours or schools."]]],
  st:[["≈10%","of paint bought is never used (estimate)"],["0","chemicals should ever reach drains or soil"]],
  p:["Protects groundwater, rivers and wildlife from toxic runoff.","Keeps water-treatment plants working properly.","Reusing paint saves the resources used to make it."],g:"Supports UN Goals 3 and 6."},
 ar:{n:"دهان أو مواد كيميائية",m:"نفايات منزلية خطرة",k:"دهان طلاء مواد كيميائية تنر كلور منظفات زيت مبيدات",
  s:[["h","لا تسكب الدهان أو المذيبات أو المواد الكيميائية في المصارف أو على التربة أبدًا."],["h","لا تخلط المواد الكيميائية أبدًا، فالكلور مع الأمونيا يُنتج غازًا سامًا."],["m","أبقِ المنتجات في عبواتها الأصلية الموسومة ومغلقة، واعمل في مكان جيد التهوية."]],
  r:["المواد الكيميائية والدهانات الزيتية تُسلَّم لموقع النفايات الخطرة.",["أغلق العبوات بإحكام وأبقِ الملصقات عليها.","انقلها واقفة داخل صندوق.","سلّمها لنقطة النفايات الخطرة، وعلب المعدن الفارغة والجافة تُدوَّر مع المعادن."]],
  d:["الدهان المائي المتبقي يمكن خلطه ليصبح دهانًا مدوَّرًا.",["أعطِ الدهان الصالح للمدارس أو الجمعيات.","اترك الكميات الصغيرة من الدهان المائي تجف قبل التخلص منها إن كان ذلك مسموحًا."]],
  u:[["استخدم البقايا في مشاريع صغيرة",["لوّن الأصص أو بيوت الطيور أو الأثاث القديم.","شارك العلب المتبقية مع الجيران أو المدارس."]]],
  st:[["≈10%","من الدهان المشترى لا يُستخدم أبدًا (تقدير)"],["0","مواد كيميائية يجب أن تصل إلى المصارف أو التربة"]],
  p:["يحمي المياه الجوفية والأنهار والحياة البرية من التلوث السام.","يحافظ على عمل محطات معالجة المياه.","إعادة استخدام الدهان توفر الموارد اللازمة لصنعه."],g:"يدعم هدفي الأمم المتحدة 3 و6."}},

{id:"jift",e:"🫒",f:["text","video","video","text"],
 en:{n:"Jift (olive pomace)",m:"Olive pits, skins and pulp from olive mills",k:"jift jeft olive pomace mill olive oil press pits zibar",
  s:[["h","Never burn jift in a closed room or tent — it produces carbon monoxide, which can kill without warning. Use only in a stove with a chimney and keep a window open."],["h","Olive-mill wastewater (zibar) is toxic to soil and water — never dump it on land or in valleys."],["m","Store jift dry; damp piles can heat up, ferment and grow mould."]],
  r:["Return jift to the olive mill or a pomace processor, where leftover oil is extracted.",["Ask your olive mill where its jift goes.","Collect it in sacks while fresh.","Deliver it to a pomace-oil factory or a jift-briquette maker."]],
  d:["Jift is pressed into fuel briquettes for winter heating — a traditional use in Jordan and Palestine.",["Dry the jift in the sun.","Press it into blocks or buy ready-made briquettes.","Burn only in a vented stove with a chimney."]],
  u:[["Compost and soil improver",["Mix jift with manure and green waste (about 1 part jift to 3 parts other material).","Turn the pile every two weeks and keep it moist.","Use the finished compost after 3–4 months."]],["Activated carbon and garden mulch",["Ground olive pits can be made into activated carbon for water filters by specialised factories.","At home, spread aged, composted jift thinly as mulch around trees."]]],
  st:[["≈35–40%","of the olives' weight is left as pomace (estimate)"],["0 L","of zibar should ever reach soil or valleys"]],
  p:["Turns a major Mediterranean farm waste into heat, oil and fertiliser.","Replaces some diesel and wood for heating.","Prevents pollution of soil and groundwater from olive-mill waste."],g:"Supports UN Goals 7, 12 and 15."},
 ar:{n:"جفت الزيتون",m:"بذور وقشور ولب الزيتون من المعاصر",k:"جفت زيتون معصرة زيت زيت الزيتون زيبار نوى",
  s:[["h","لا تحرق الجفت أبدًا في غرفة مغلقة أو خيمة، فهو يُطلق أول أكسيد الكربون الذي قد يقتل دون إنذار. استخدمه فقط في مدفأة لها مدخنة وأبقِ النافذة مفتوحة."],["h","مياه المعاصر (الزيبار) سامة للتربة والمياه، فلا تسكبها أبدًا على الأرض أو في الأودية."],["m","خزّن الجفت جافًا، فالأكوام الرطبة قد تسخن وتتخمر وتتعفن."]],
  r:["أعد الجفت إلى المعصرة أو مصنع معالجة الجفت حيث يُستخرج الزيت المتبقي.",["اسأل المعصرة إلى أين يذهب الجفت.","اجمعه في أكياس وهو طازج.","سلّمه لمصنع زيت الجفت أو صانع قوالب الجفت."]],
  d:["يُضغط الجفت إلى قوالب وقود للتدفئة في الشتاء، وهو استخدام تقليدي في الأردن وفلسطين.",["جفّف الجفت تحت الشمس.","اضغطه إلى قوالب أو اشترِ قوالب جاهزة.","أحرقه فقط في مدفأة لها مدخنة وتهوية."]],
  u:[["سماد ومحسّن للتربة",["اخلط الجفت مع روث الحيوانات والمخلفات الخضراء (جزء جفت لكل 3 أجزاء من غيره تقريبًا).","قلّب الكومة كل أسبوعين وأبقها رطبة.","استخدم السماد الناضج بعد 3 إلى 4 أشهر."]],["فحم نشط وغطاء للتربة",["نوى الزيتون المطحون يمكن أن تحوله مصانع متخصصة إلى فحم نشط لفلاتر المياه.","في المنزل، انثر الجفت المسمّد القديم بطبقة رقيقة حول الأشجار."]]],
  st:[["≈35–40%","من وزن الزيتون يبقى جفتًا (تقدير)"],["0 لتر","من الزيبار يجب أن يصل إلى التربة أو الأودية"]],
  p:["يحوّل نفاية زراعية كبيرة في المتوسط إلى تدفئة وزيت وسماد.","يحل محل جزء من السولار والحطب في التدفئة.","يمنع تلوث التربة والمياه الجوفية بمخلفات المعاصر."],g:"يدعم أهداف الأمم المتحدة 7 و12 و15."}},

{id:"fabric",e:"🧵",f:["text","video","video","photo"],
 en:{n:"Extra fabric",m:"Fabric offcuts and scraps",k:"fabric scraps offcuts tailor sewing cloth leftover textile",
  s:[["l","Keep scissors and pins in a closed box when working with children."],["l","Don't burn synthetic scraps — they melt and release harmful fumes."]],
  r:["Large clean pieces can go to textile banks; tiny scraps usually can't.",["Sort scraps by size and fibre (cotton, wool, polyester).","Bag clean pieces bigger than a hand.","Give them to a textile bank, tailor or school art department."]],
  d:["Small scraps are shredded into stuffing, insulation and industrial wipes.",["Collect tiny scraps in a pillowcase.","Use them as stuffing for cushions, pet beds or soft toys."]],
  u:[["Patchwork bag or quilt",["Cut scraps into equal squares.","Sew them together into a panel.","Make a tote bag, cushion or quilt."]],["Fabric gift wrap and hair ties",["Hem square pieces to wrap gifts Japanese-style (furoshiki).","Sew thin strips into scrunchies."]]],
  st:[["≈15%","of fabric is cut off and wasted in clothes making (estimate)"],["≈2,700 L","of water behind one cotton T-shirt"]],
  p:["Saves the water and energy already used to make the fabric.","Keeps synthetic fibres out of landfill.","Supports local tailors and creative small businesses."],g:"Supports UN Goals 8 and 12."},
 ar:{n:"قماش زائد",m:"قصاصات وبقايا القماش",k:"قماش قصاصات بقايا خياط خياطة منسوجات",
  s:[["l","احفظ المقصات والدبابيس في علبة مغلقة عند العمل مع الأطفال."],["l","لا تحرق القصاصات الصناعية، فهي تذوب وتطلق أبخرة ضارة."]],
  r:["القطع الكبيرة النظيفة تُقبل في حاويات الملابس، أما القصاصات الصغيرة فلا غالبًا.",["افرز القصاصات حسب الحجم والنوع (قطن، صوف، بوليستر).","ضع القطع النظيفة الأكبر من كف اليد في كيس.","أعطها لحاوية الملابس أو خياط أو قسم الفنون في المدرسة."]],
  d:["القصاصات الصغيرة تُمزق لتصبح حشوة وعزلًا ومناديل تنظيف صناعية.",["اجمع القصاصات الصغيرة في كيس وسادة.","استخدمها حشوة للوسائد أو فرش الحيوانات أو الألعاب القماشية."]],
  u:[["حقيبة أو لحاف من الرقع",["قصّ القصاصات إلى مربعات متساوية.","اخِطها معًا لتصنع قطعة كبيرة.","اصنع منها حقيبة أو وسادة أو لحافًا."]],["تغليف هدايا وربطات شعر من القماش",["خِط أطراف قطع مربعة لتغليف الهدايا بالطريقة اليابانية (فوروشيكي).","اخِط الشرائط الرفيعة لتصبح ربطات شعر."]]],
  st:[["≈15%","من القماش يُقص ويُهدر أثناء صنع الملابس (تقدير)"],["≈2,700 لتر","ماء خلف قميص قطني واحد"]],
  p:["يوفر الماء والطاقة المستهلكة أصلًا في صنع القماش.","يُبعد الألياف الصناعية عن المكبات.","يدعم الخياطين المحليين والمشاريع الإبداعية الصغيرة."],g:"يدعم هدفي الأمم المتحدة 8 و12."}},

{id:"pcup",e:"☕",f:["text","text","photo","video"],
 en:{n:"Paper cup",m:"Paperboard with a thin plastic lining",k:"paper cup coffee cup disposable takeaway",
  s:[["l","Paper cups are lined with plastic — they don't go in normal paper recycling unless your area says so."],["l","Remove plastic lids and sleeves first."]],
  r:["Only special cup-recycling bins and mills can separate the plastic lining.",["Empty and shake out the cup.","Remove the plastic lid (recycle it with plastics if accepted).","Use a dedicated cup-recycling bin; otherwise put it in general waste."]],
  d:["Separated paper fibre becomes packaging, card and paper bags.",["Look for coffee shops with cup-recycling bins."]],
  u:[["Seedling pots",["Poke a hole in the base.","Fill with soil and sow seeds.","Remove the cup when planting out."]],["Kids' craft figures",["Paint cups as animals or characters.","Use them for counting games or a puppet show."]]],
  st:[["≈1 in 400","paper cups recycled in some countries (estimate)"],["≈250 bn","paper cups used worldwide each year (estimate)"]],
  p:["Choosing a reusable cup avoids most of the waste.","Special recycling saves wood fibre.","Keeps plastic linings from breaking into microplastics."],g:"Supports UN Goal 12."},
 ar:{n:"كوب ورقي",m:"كرتون مبطّن بطبقة بلاستيك رقيقة",k:"كوب ورقي قهوة كاسات استخدام واحد",
  s:[["l","الأكواب الورقية مبطنة بالبلاستيك، فلا تُوضع في حاوية الورق العادية إلا إذا سمحت منطقتك بذلك."],["l","انزع الأغطية والأكمام البلاستيكية أولًا."]],
  r:["فقط حاويات ومصانع خاصة بالأكواب تستطيع فصل البطانة البلاستيكية.",["أفرغ الكوب وانفضه.","انزع الغطاء البلاستيكي (ودوّره مع البلاستيك إن كان مقبولًا).","استخدم حاوية خاصة بالأكواب، وإلا فضعه في النفايات العامة."]],
  d:["الألياف الورقية المفصولة تصبح تغليفًا وكرتونًا وأكياسًا ورقية.",["ابحث عن المقاهي التي فيها حاويات لتدوير الأكواب."]],
  u:[["أصص للشتلات",["اثقب القاعدة.","املأه بالتربة وازرع البذور.","انزع الكوب عند نقل الشتلة إلى الأرض."]],["مجسمات للأطفال",["لوّن الأكواب على شكل حيوانات أو شخصيات.","استخدمها لألعاب العد أو مسرح الدمى."]]],
  st:[["≈1 من كل 400","كوب ورقي يُدوَّر في بعض الدول (تقدير)"],["≈250 مليار","كوب ورقي يُستخدم في العالم سنويًا (تقدير)"]],
  p:["اختيار كوب قابل لإعادة الاستخدام يتجنب معظم النفايات.","التدوير الخاص يوفر ألياف الخشب.","يمنع تفتت البطانة البلاستيكية إلى جزيئات دقيقة."],g:"يدعم الهدف 12 للأمم المتحدة."}},

{id:"straw",e:"🧋",f:["text","text","photo","video"],
 en:{n:"Straw and cup lid",m:"Plastic straws (#5 PP) and lids (#5 PP or #6 PS)",k:"straw straws lid cup lid drinking straw plastic straw bubble tea",
  s:[["m","Straws and lids are a choking hazard for babies, young children and pets — keep them out of reach."],["m","Don't burn or melt straws and lids — the fumes are harmful."],["l","\"Compostable\" PLA straws only break down in industrial compost, not at home or in nature."]],
  r:["Straws are too small for most sorting machines; some lids can be recycled if your area accepts their plastic number.",["Rinse the lid and check the number in the recycling triangle.","Put lids marked 5 in the plastics bin if your area accepts #5.","Put used straws in general waste — never on the ground, where they reach the sea."]],
  d:["Clean straws and lids collected in bulk can be shredded into low-grade plastic items like plant pots.",["Collect clean straws and lids in a bottle or jar of the same plastic type.","Give them to a school or community plastic-recycling project that shreds plastic."]],
  u:[["Straw building kit or art",["Wash and dry straws well.","Cut them into different lengths.","Join them with tape or pipe cleaners to build shapes, or glue them in patterns for a mosaic picture."]],["Lid mosaic or game counters",["Collect lids of different colours.","Glue them onto board to make a mosaic, or use them as counters for games and maths lessons."]]],
  st:[["Top 10","item found in beach clean-ups worldwide"],["≈20 min","typical time a straw is used"]],
  p:["Keeps small plastic out of the sea, where turtles and birds swallow it.","Saying no to straws and choosing reusable metal, glass or bamboo straws stops the waste at the start.","Reusing lids and straws cuts demand for new oil-based plastic."],g:"Supports UN Goals 12 and 14."},
 ar:{n:"شفاطة وغطاء كوب",m:"شفاطات بلاستيكية (PP رقم 5) وأغطية (PP رقم 5 أو PS رقم 6)",k:"شفاطة شفاطات مصاصة قشة غطاء غطاء كوب بلاستيك بابل تي",
  s:[["m","الشفاطات والأغطية قد تسبب الاختناق للرضّع والأطفال الصغار والحيوانات الأليفة، أبعدها عن متناولهم."],["m","لا تحرق الشفاطات والأغطية أو تُذبها، فأبخرتها ضارة."],["l","الشفاطات القابلة للتحلل (PLA) تتحلل فقط في منشآت السماد الصناعية، وليس في المنزل أو الطبيعة."]],
  r:["الشفاطات صغيرة جدًا لمعظم آلات الفرز، وبعض الأغطية يمكن تدويرها إذا كانت منطقتك تقبل رقم بلاستيكها.",["اشطف الغطاء وابحث عن الرقم داخل مثلث التدوير.","ضع الأغطية التي تحمل رقم 5 في حاوية البلاستيك إذا كانت منطقتك تقبله.","ضع الشفاطات المستعملة في النفايات العامة، ولا ترمها على الأرض حيث تصل إلى البحر."]],
  d:["الشفاطات والأغطية النظيفة المجمّعة بكميات يمكن فرمها لصنع منتجات بلاستيكية بسيطة مثل أصص النباتات.",["اجمع الشفاطات والأغطية النظيفة داخل عبوة أو مرطبان من نوع البلاستيك نفسه.","سلّمها لمدرسة أو مشروع مجتمعي يفرم البلاستيك لإعادة تدويره."]],
  u:[["مجموعة بناء أو فن من الشفاطات",["اغسل الشفاطات وجففها جيدًا.","قصّها بأطوال مختلفة.","اربطها بشريط لاصق أو أسلاك منظفات الأنابيب لبناء أشكال، أو ألصقها بنقوش لعمل لوحة فسيفساء."]],["فسيفساء أو قطع ألعاب من الأغطية",["اجمع أغطية بألوان مختلفة.","ألصقها على لوح لصنع فسيفساء، أو استخدمها قطعًا للألعاب ودروس الرياضيات."]]],
  st:[["من أكثر 10","مواد تُجمع في حملات تنظيف الشواطئ حول العالم"],["≈20 دقيقة","مدة استخدام الشفاطة عادةً"]],
  p:["يُبعد البلاستيك الصغير عن البحر حيث تبتلعه السلاحف والطيور.","رفض الشفاطة واختيار شفاطات معدنية أو زجاجية أو من الخيزران يمنع النفايات من البداية.","إعادة استخدام الأغطية والشفاطات تقلل الطلب على بلاستيك النفط الجديد."],g:"يدعم هدفي الأمم المتحدة 12 و14."}},

{id:"cutlery",e:"🍴",f:["text","text","photo","photo"],
 en:{n:"Plastic spoons and forks",m:"Polystyrene or polypropylene (#6 or #5)",k:"plastic spoon fork knife cutlery disposable",
  s:[["l","Broken plastic cutlery has sharp edges — keep it away from young children."],["l","Don't heat or melt plastic cutlery for crafts."]],
  r:["Plastic cutlery is usually too small and mixed to recycle.",["Wash and reuse it as many times as you can.","Check if your area accepts #5 plastic.","Otherwise put it in general waste — never in nature."]],
  d:["Where collected, it is shredded into low-grade plastic items like plant pots.",["Collect clean cutlery in bulk for schools or community recycling projects."]],
  u:[["Garden plant markers",["Write plant names on the spoon bowl with a marker.","Push the handle into the soil."]],["Spoon art: flower mirror or lamp",["Cut off the handles with strong scissors (adult only).","Glue the spoon heads in rings around a mirror or jar like petals.","Paint them."]]],
  st:[["≈40 bn","plastic utensils thrown away in the US yearly (estimate)"],["a few minutes","typical use before they're thrown away"]],
  p:["Reusing cutlery cuts demand for oil-based plastic.","Keeps small plastic pieces out of seas and animal stomachs.","Encourages switching to metal or wooden cutlery."],g:"Supports UN Goals 12 and 14."},
 ar:{n:"ملاعق وشوك بلاستيكية",m:"بوليسترين أو بولي بروبيلين (رقم 6 أو 5)",k:"ملعقة شوكة سكين بلاستيك أدوات مائدة استخدام واحد",
  s:[["l","أدوات المائدة البلاستيكية المكسورة لها حواف حادة، أبعدها عن الأطفال الصغار."],["l","لا تسخّن أو تُذب البلاستيك في الأعمال اليدوية."]],
  r:["أدوات المائدة البلاستيكية غالبًا صغيرة ومختلطة جدًا للتدوير.",["اغسلها وأعد استخدامها قدر الإمكان.","تحقّق هل تقبل منطقتك البلاستيك رقم 5.","وإلا فضعها في النفايات العامة، ولا ترمها في الطبيعة أبدًا."]],

/* ===== HELPERS ===== */
const $ = (s,r=document)=>r.querySelector(s), $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const NEW_IDS = ["jift","fabric","pcup","cutlery","straw","glass","acc"];
let prefs = Object.assign({read:false,rate:"1",lang:(navigator.language||"").startsWith("ar")?"ar":"en",theme:"system",size:"100",contrast:false,motion:false,spacing:false,voice:false}, store.get("ecoloop:prefs",{}));
const T = () => STR[prefs.lang];
const t = (k,vars={}) => { let s = T()[k] ?? STR.en[k] ?? k; for(const [a,b] of Object.entries(vars)) s = s.replace("{"+a+"}", b); return s; };
const announce = msg => { const a=$("#announcer"); a.textContent=""; setTimeout(()=>a.textContent=msg,60); };
const reduceMotion = () => prefs.motion || matchMedia("(prefers-reduced-motion: reduce)").matches;
const norm = s => String(s||"").toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim();
const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtDate = (d,o) => new Intl.DateTimeFormat(T().locale,o).format(d);

/* ===== PREFERENCES / I18N ===== */
function applyPrefs(){
  const r = document.documentElement;
  r.lang = prefs.lang; r.dir = T().dir;
  if(prefs.theme==="system") r.removeAttribute("data-theme"); else r.dataset.theme = prefs.theme;
  r.style.fontSize = prefs.size + "%";
  prefs.contrast ? r.dataset.contrast="high" : r.removeAttribute("data-contrast");
  prefs.motion ? r.dataset.motion="reduce" : r.removeAttribute("data-motion");
  prefs.spacing ? r.dataset.spacing="wide" : r.removeAttribute("data-spacing");
  document.title = prefs.lang==="ar" ? "إيكولوب — مساعد الاستدامة" : "EcoLoop — sustainability agent";
  $$("[data-i18n]").forEach(el=>el.textContent = t(el.dataset.i18n));
  $$("[data-i18n-ph]").forEach(el=>el.placeholder = t(el.dataset.i18nPh));
  $$("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  const lb = $("#langBtnText"); lb.textContent = T().other; lb.lang = T().otherLang;
  $("#langBtn").setAttribute("aria-label", prefs.lang==="ar" ? "Switch to English" : "التبديل إلى العربية");
  $("#hint").textContent = sample || !aiChecked ? t("hint") : t("hintNoAI");
  store.set("ecoloop:prefs", prefs);
  updateReaderBar();
}
function rerenderAll(){ applyPrefs(); drawGrid($("#q").value); if(current) render(current, false); if(!$("#page-tracker").hidden) renderTracker(); if(!$("#page-play").hidden) renderPlay(); if($("#settings").open) renderSettings(); }
$("#langBtn").onclick = () => { prefs.lang = prefs.lang==="ar"?"en":"ar"; rerenderAll(); announce(t("langChanged")); };

/* ===== NAVIGATION ===== */
function showPage(p){
  $$("nav.tabs button").forEach(b=>b.toggleAttribute("aria-current", false) || (b.dataset.page===p && b.setAttribute("aria-current","page")));
  $("#page-materials").hidden = p!=="materials"; $("#heroMaterials").hidden = p!=="materials";
  $("#page-tracker").hidden = p!=="tracker"; $("#heroTracker").hidden = p!=="tracker";
  $("#page-play").hidden = p!=="play"; $("#heroPlay").hidden = p!=="play";
  if(p!=="play" && G.mode==="play" && !G.paused) togglePause();
  if(p==="tracker") renderTracker();
  if(p==="play") renderPlay();
  $("#main").focus({preventScroll:true});
}
$$("nav.tabs button").forEach(b=>b.onclick=()=>showPage(b.dataset.page));

/* ===== MATERIAL GRID & SEARCH ===== */
function matText(m,l){ return m[l]; }
function drawGrid(filter=""){
  const f = norm(filter);
  const list = MATS.filter(m => !f || norm([m.en.n,m.en.k,m.en.m,m.ar.n,m.ar.k].join(" ")).includes(f));
  $("#grid").innerHTML = list.map(m => `<li><button class="mat" type="button" data-id="${m.id}" aria-pressed="${current?.id===m.id}">
    <span class="emo" aria-hidden="true">${m.e}</span><span class="lbl">${esc(matText(m,prefs.lang).n)}</span>${NEW_IDS.includes(m.id)?`<span class="new">${t("isNew")}</span>`:""}</button></li>`).join("");
  $("#empty").hidden = list.length>0;
  $("#matCount").textContent = t("count",{n:list.length});
}
$("#q").addEventListener("input", e => drawGrid(e.target.value));
$("#grid").addEventListener("click", e => {
  const b = e.target.closest(".mat"); if(!b) return;
  current = {id:b.dataset.id}; drawGrid($("#q").value); render(current, true);
});

/* ===== VIEW MODEL ===== */
let current = null;   // {id} for built-in, or {ai:true, data, lang}
let method = "recycle";
function vm(cur){
  if(cur.ai) return cur.data;
  const m = MATS.find(x=>x.id===cur.id), L = m[prefs.lang], f = m.f;
  return { id:m.id, e:m.e, n:L.n, m:L.m, s:L.s,
    r:{sum:L.r[0],steps:L.r[1],fmt:f[0]}, d:{sum:L.d[0],steps:L.d[1],fmt:f[1]},
    u:L.u.map((x,i)=>({t:x[0],steps:x[1],fmt:f[2+i]||"photo"})), st:L.st, p:L.p, g:L.g };
}

    </section>
  </article>`;
  const tabs = $$(".cycle [role=tab]");

/* ===== READ ALOUD (bilingual) ===== */
const Reader = (()=>{
  const synth = window.speechSynthesis, ok = !!synth && "SpeechSynthesisUtterance" in window;
  let voices = [], timer = null, lit = null, suppressUntil = 0;
  const loadVoices = ()=>{ voices = ok ? synth.getVoices() : []; if($("#settings")?.open) renderSettings(true); };
  if(ok){ loadVoices(); synth.addEventListener?.("voiceschanged", loadVoices); }
  const AR = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/, LAT = /[A-Za-z]/;
  function voiceFor(l){
    const prefsList = l==="ar" ? ["ar-jo","ar-sa","ar-ae","ar-eg","ar"] : ["en-gb","en-us","en-au","en"];
    for(const p of prefsList){ const v = voices.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(p)); if(v) return v; }
    return null;
  }
  // make symbols speakable in each language
  function clean(text,l){
    return text.replace(/≈\s*/g, l==="ar"?"حوالي ":"about ")
      .replace(/CO₂/g,"CO2").replace(/(\d)\s*×/g, l==="ar"?"$1 أضعاف":"$1 times")
      .replace(/(\d)\s*[–-]\s*(\d)/g, l==="ar"?"$1 إلى $2":"$1 to $2")
      .replace(/\+(\d)/g, l==="ar"?"أكثر من $1":"more than $1").replace(/(\d)\+/g, l==="ar"?"أكثر من $1":"more than $1")
      .replace(/\p{Extended_Pictographic}|\uFE0F|\u200D/gu,"").replace(/[↗✓✕•·★＋]/g," ").replace(/\s+/g," ").trim();
  }
  // split mixed text into Arabic / English runs so each gets the right voice
  function runs(text){
    const out=[];
    for(const w of text.split(/\s+/).filter(Boolean)){
      const l = AR.test(w) ? "ar" : LAT.test(w) ? "en" : null, last = out[out.length-1];
      if(!last) out.push({l:l||prefs.lang, t:w}); else if(!l || l===last.l) last.t += " "+w; else out.push({l, t:w});
    }
    return out;
  }
  function pieces(text){ // short sentences avoid a Chrome bug that cuts off long speech
    const parts = text.match(/[^.!?؟،,;؛:]+[.!?؟،,;؛:]*/g) || [text], out=[]; let cur="";
    for(const p of parts){ if((cur+p).length>180 && cur){ out.push(cur); cur=p; } else cur+=p;
      while(cur.length>180){ const cut = cur.lastIndexOf(" ",180)>40 ? cur.lastIndexOf(" ",180) : 180; out.push(cur.slice(0,cut)); cur=cur.slice(cut); } }
    if(cur.trim()) out.push(cur); return out;
  }
  function highlight(el){ if(lit) lit.classList.remove("reading"); lit = el||null; if(lit) lit.classList.add("reading"); }
  let token = 0, audio = null;
  function stop(){ token++; clearTimeout(timer); if(ok) synth.cancel(); if(audio){ audio.pause(); audio=null; } highlight(null); }
  // No device voice for this language (common for Arabic on laptops)? Use an online voice instead.
  const onlineUrl = (text,l) => "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+(l==="ar"?"ar":"en")+"&q="+encodeURIComponent(text);
  function failNote(l){ const m = t(l==="ar"?"raFailAr":"raFailEn"); announce(m); const n=$("#rbNote"); if(n){ n.textContent=m; n.hidden=false; } }
  function playOne(q, my, next){
    const v = voiceFor(q.l), rate = +prefs.rate || 1;
    if(v && ok){
      const u = new SpeechSynthesisUtterance(q.t); u.voice=v; u.lang=v.lang; u.rate=rate;
      u.onend = ()=>{ if(my===token) next(); }; u.onerror = ()=>{ if(my===token) next(); };
      synth.speak(u);
    } else {
      audio = new Audio(onlineUrl(q.t,q.l)); audio.playbackRate = rate;
      audio.onended = ()=>{ if(my===token) next(); };
      audio.onerror = ()=>{ if(my===token){ failNote(q.l); next(); } };
      audio.play().catch(()=>{ if(my===token){ failNote(q.l); next(); } });
    }
  }
  function sayItems(items, onend){
    if(!items.length) return;
    stop(); const my = token, queue = [];
    items.forEach(it=>{ runs(it.text).forEach(r=>pieces(clean(r.t,r.l)).forEach(ch=>{ if(ch.trim()) queue.push({t:ch,l:r.l,el:it.el}); })); });
    let i = 0;
    const next = ()=>{ if(my!==token) return; if(i>=queue.length){ highlight(null); onend&&onend(); return; } const q=queue[i++]; highlight(q.el); playOne(q,my,next); };
    timer = setTimeout(next, 60);
  }
  const say = (text, el, onend) => sayItems([{text, el}], onend);
  return { ok, say, sayItems, stop, voiceFor, suppress:(ms)=>{ suppressUntil = Date.now()+ms; }, suppressed:()=>Date.now()<suppressUntil };
})();

// What should be read for an element? Its real content, never just "box" or "text".
const READ_SEL = "button,a,input,select,textarea,[role=tab],summary,label,h1,h2,h3,h4,h5,p,li,th,td,figcaption,caption,legend,.stat,.card,.badge,.lvl,.tag,.mbar";
function plainText(el){
  const c = el.cloneNode(true);
  c.querySelectorAll('[aria-hidden="true"],.emo,script,style,input,svg').forEach(n=>n.remove());
  c.querySelectorAll("*").forEach(n=>n.append(" "));   // keep words in separate boxes apart
  return c.textContent.replace(/\s+/g," ").trim();
}
function readableText(el){
  if(el.matches("input[type=checkbox],input[type=radio]")){
    const lab = el.getAttribute("aria-label") || (el.labels?.[0] ? plainText(el.labels[0]) : "");
    const state = el.type==="radio" ? (el.checked ? t("selected") : "")
      : el.getAttribute("role")==="switch" ? (el.checked ? t("on") : t("off")) : (el.checked ? t("checked") : t("notChecked"));
    return [lab, state].filter(Boolean).join(", ");
  }
  if(el.matches("input,textarea,select")){
    const lab = el.getAttribute("aria-label") || (el.labels?.[0] ? plainText(el.labels[0]) : "") || el.placeholder || "";
    const val = el.value ? el.value : (el.placeholder && el.placeholder!==lab ? el.placeholder : "");
    return [lab, val].filter(Boolean).join(": ");
  }
  if(el.matches("label") && el.control && el.control.matches("input[type=checkbox],input[type=radio]")) return readableText(el.control);
  const own = plainText(el);
  const aria = el.getAttribute("aria-label");
  let text = el.matches("button,a,[role=tab]") ? (own || aria || "") : (own || aria || "");
  if(el.matches("[role=tab]") && el.getAttribute("aria-selected")==="true") text += ", " + t("selected");
  if(el.getAttribute("aria-pressed")==="true") text += ", " + t("on");
  return text;
}
function readElement(el){
  if(!el) return;
  const text = readableText(el); if(text) Reader.say(text, el);
}
let lastRead = {el:null, time:0};
function readTarget(target){
  if(!prefs.read || Reader.suppressed()) return;
  if(target.closest("#readerBar,[data-noread]")) return;
  const el = target.closest(READ_SEL); if(!el) return;
  if(lastRead.el===el && Date.now()-lastRead.time<500) return;
  lastRead = {el, time:Date.now()};
  setTimeout(()=>{ if(!Reader.suppressed()) readElement(el.isConnected ? el : null); }, 40);   // wait so ticked boxes / selected tabs read their new state
}

function localAgent(text, failed){
  const m = localMatch(text);
  let data, note;
  if(m){
    const v = vm({id:m.id});
    data = Object.assign({}, v, {n:text.charAt(0).toUpperCase()+text.slice(1), m:`${v.n} · ${v.m}`, local:true});
    note = t("offNote",{x:`${v.e} ${v.n}`});
  } else { data = Object.assign(genericData(text),{local:true}); note = t("offNote",{x:t("offGenericN")}); }
  if(failed) note = t("offFail")+" "+note;
  else if(aiMode()==="local") note += t("offNoteKey");
  data.note = note;
  return data;
}
function localAnswer(d, q){
  const s = norm(q), has = re => re.test(s);
  const list = a => a.map(x=>"• "+x).join("\n");
  const safety = (d.s||[]).map(x=>x[1]);
  if(has(/kid|child|children|son|daughter|class|school|طفل|اطفال|ابن|بنت|صف|مدرس|طلاب/)) return safety.length ? t("la_kids")+"\n"+list(safety) : t("la_kidsNone");
  if(has(/tool|need|supplies|material|equipment|ادوات|اداة|احتاج|مواد|لوازم/)) return d.u?.length ? t("la_tools",{x:d.u[0].t})+"\n"+list(d.u[0].steps) : t("la_noTools")+"\n"+list(d.r.steps);
  if(has(/safe|danger|hazard|risk|burn|fire|toxic|harm|امن|خطر|خطير|حريق|سام|ضرر|يحرق/)) return safety.length ? t("la_safe")+"\n"+list(safety) : t("la_safeNone");
  if(has(/why|benefit|environment|planet|impact|good|لماذا|فائدة|فوائد|بيئة|كوكب|اثر/)) return t("la_why")+"\n"+list([...(d.st||[]).map(x=>x[0]+" "+x[1]), ...(d.p||[])]);
  if(has(/where|bin|throw|dispose|put|recycle|اين|حاوية|ارمي|اتخلص|اضع|تدوير/)) return t("la_where")+" "+d.r.sum+"\n"+list(d.r.steps);
  if(has(/idea|make|craft|upcycle|diy|art|create|فكرة|افكار|اصنع|اعمل|ابداع|يدوي/)) return d.u?.length ? t("la_ideas")+"\n"+d.u.map(u=>"• "+u.t+": "+u.steps.join(" ")).join("\n") : t("la_noIdeas");
  return t("la_def")+" "+d.r.sum+"\n"+list(d.r.steps)+(safety.length?"\n\n"+t("la_safe")+"\n"+list(safety.slice(0,2)):"");
}

const PROMPT = (item,lang) => `You are EcoLoop, an environmental-sustainability agent. A user wants to dispose of or reuse this item: "${item}".
Write ALL text values in ${lang==="ar"?"Modern Standard Arabic":"plain, simple English"}.
Return ONLY a JSON object, no markdown, with exactly this shape:
{"name":"short item name","material":"main material(s)","emoji":"one emoji that best depicts the item",
"safety":[{"level":"h|m|l","text":"safety point to know BEFORE handling"}],
"recycle":{"summary":"1 sentence","steps":["2-4 short steps"],"format":"video|photo|text"},
"downcycle":{"summary":"1 sentence","steps":["1-3 short steps"],"format":"video|photo|text"},
"upcycle":[{"title":"idea name","steps":["2-3 short steps"],"format":"video|photo|text"}],
"stats":[{"v":"short figure e.g. ≈60%","l":"what it means"}],"benefits":["2-3 environmental benefits"],"goals":"which UN Sustainable Development Goals it supports, one sentence"}
Rules: 2-4 safety points; real hazards (fire, toxic fumes, carbon monoxide, sharp edges, chemicals, mercury) are level h. 1-2 upcycle ideas; if upcycling is unsafe (hazardous waste) return an empty array. "format" is the medium that best teaches that procedure: video for hands-on techniques, photo for visual/design ideas, text for rules and processes. Exactly 2 stats using widely cited figures, marking estimates with ≈. Consider a Jordan / Middle East context where relevant.`;
function showResult(html){
  const res=$("#result"); res.innerHTML=html;
  res.scrollIntoView({behavior:reduceMotion()?"auto":"smooth",block:"start"});
}
function setHint(msg, isErr){
  const h=$("#hint"); h.textContent=msg||t(sample?"hint":"hintNoAI");
  h.style.color = isErr ? "#FFD3CE" : ""; h.style.fontWeight = isErr ? "700" : "";
}
async function askAgent(){
  const text=$("#q").value.trim(); if(!text){ $("#q").focus(); return; }
  // 1) exact name, or only one matching tile -> open it straight away
  const f=norm(text);
  const exact=MATS.find(m=>norm(m.en.n)===f||norm(m.ar.n)===f);
  const hits=MATS.filter(m=>norm([m.en.n,m.en.k,m.en.m,m.ar.n,m.ar.k].join(" ")).includes(f));
  const pick=exact||(hits.length===1?hits[0]:null);
  if(pick){ setHint(); current={id:pick.id}; drawGrid($("#q").value); render(current,true); return; }
  // 2) no AI available -> built-in offline agent
  const mode = aiMode();
  if(mode==="local"){ setHint(); current=null; drawGrid($("#q").value); render({ai:true,data:localAgent(text)},true); return; }
  // 3) Claude (inside the app) or the viewer's own API key
  const btn=$("#askBtn"), label=btn.textContent;
  btn.disabled=true; btn.textContent = prefs.lang==="ar" ? "جارٍ التحليل…" : "Analysing…";
  setHint(t("analysing",{x:text}));
  showResult(`<div class="panel status" role="status"><span class="dot" aria-hidden="true"></span><span>${esc(t("analysing",{x:text}))}</span></div>`);
  try{
    const j = mode==="claude" ? await sample.json(PROMPT(text,prefs.lang),{modelTier:"default"}) : parseJSON(await keyCall(PROMPT(text,prefs.lang), false));
    const data={e:j.emoji||"♻️",n:j.name||text,m:j.material||"",s:(j.safety||[]).map(s=>[String(s.level||"l")[0],s.text]),
      r:{sum:j.recycle?.summary||"",steps:j.recycle?.steps||[],fmt:j.recycle?.format||"text"},
      d:{sum:j.downcycle?.summary||"",steps:j.downcycle?.steps||[],fmt:j.downcycle?.format||"text"},
      u:(j.upcycle||[]).map(u=>({t:u.title,steps:u.steps||[],fmt:u.format||"photo"})),
      st:(j.stats||[]).map(s=>[s.v,s.l]),p:j.benefits||[],g:j.goals||""};
    setHint(); current=null; drawGrid($("#q").value); render({ai:true,data},true);
  }catch(e){
    console.error("EcoLoop agent error:", e);
    if(e?.code==="bad_key") setHint(t("errKey"), true);
    else if(e?.code==="rate_limited") setHint(t("errRate"), true);
    else setHint();
    current=null; render({ai:true,data:localAgent(text, true)},true);   // never leave the user empty-handed
  }finally{ btn.disabled=false; btn.textContent=label; }
}
$("#searchForm").addEventListener("submit",e=>{ e.preventDefault(); askAgent(); });
async function followUp(){
  const inp=$("#fu"), out=$("#fuOut"), btn=$("#fuBtn"), q=inp.value.trim(); if(!q) return;
  const d=vm(current), mode=aiMode();
  const box=document.createElement("div"); box.className="answer";
  const local = (pre) => { out.innerHTML=""; out.appendChild(box); box.textContent = (pre?pre+"\n\n":"") + "🌿 "+t("fuLocal")+":\n"+localAnswer(d,q); };
  if(mode==="local"){ local(); return; }
  btn.disabled=true; out.innerHTML=`<div class="status" role="status"><span class="dot" aria-hidden="true"></span>${t("thinking")}</div>`;
  const prompt = `You are EcoLoop, a sustainability agent. Item: ${d.n} (${d.m}). Safety notes: ${(d.s||[]).map(s=>s[1]).join(" | ")}.
User question: ${q}
Answer in ${prefs.lang==="ar"?"Modern Standard Arabic":"simple English"}, plain text, under 150 words, practical, and mention any safety caveat that applies. No markdown.`;
  try{
    let text;
    if(mode==="claude"){
      ({text} = await sample(prompt,{modelTier:"quick",cache:false,onText:({text})=>{ if(!box.isConnected){ out.innerHTML=""; out.appendChild(box); } box.textContent=text; }}));

    if(!box.isConnected){ out.innerHTML=""; out.appendChild(box); } box.textContent=text;
  }catch(e){ local(e?.code==="bad_key" ? t("errKey") : t("offFail")); }
  finally{ btn.disabled=false; }
}

const UPS = {
  per:   {e:"💰", vals:[10,20,35,60,100,150], costs:[0,60,160,380,800,1500]},
  streak:{e:"🔥", vals:[0,2,5,10,20],         costs:[0,80,220,500,1000]},
  shield:{e:"🛡️", vals:[5,3,1,0],             costs:[0,70,200,450]}
};
const UPK = {per:["upPer","upPerD"], streak:["upStreak","upStreakD"], shield:["upShield","upShieldD"]};
const GAME_COST = 50, GAME_REWARD = 2;
let PL = Object.assign({pts:0,streak:0,correct:0,answered:0,best:0,up:{per:0,streak:0,shield:0}}, store.get("ecoloop:play",{}));
PL.up = Object.assign({per:0,streak:0,shield:0}, PL.up);
const savePL = ()=>store.set("ecoloop:play",PL);
const upVal = k => UPS[k].vals[PL.up[k]];

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];

let QZ = null;   // current question
let lastKind = null;
function makeQuestion(){
  const L = prefs.lang;
  const kinds = shuffle(["stat","stat","who","level","high"]).filter(k=>k!==lastKind);
  for(const kind of kinds){ const q = buildQ(kind, L); if(q){ lastKind = kind; return q; } }
  return buildQ("stat", L);
}
function buildQ(kind, L){
  if(kind==="stat"){
    const all = MATS.flatMap(m=>m[L].st.map(s=>({m, v:s[0], l:s[1]}))).filter(x=>/\d/.test(x.v));
    const c = pick(all), pct = c.v.includes("%");
    let pool = [...new Set(all.filter(x=>x.v!==c.v && x.v.includes("%")===pct).map(x=>x.v))];
    if(pool.length<3) pool = [...new Set(all.filter(x=>x.v!==c.v).map(x=>x.v))];
    const opts = shuffle([c.v, ...shuffle(pool).slice(0,3)]);
    return {kind, L, prompt:t("qStat",{n:`${c.m.e} ${c.m[L].n}`}), fact:`<b>___</b> ${esc(c.l)}`,
      opts, ans:c.v, explain:`${c.v} ${c.l}`};
  }
  if(kind==="who"){
    const m = pick(MATS.filter(x=>x[L].s.length)), s = pick(m[L].s);
    const others = shuffle(MATS.filter(x=>x.id!==m.id)).slice(0,3);
    const lab = x => `${x.e} ${x[L].n}`;
    return {kind, L, prompt:t("qWho"), fact:`“${esc(s[1])}”`, opts:shuffle([lab(m),...others.map(lab)]), ans:lab(m), explain:lab(m)};
  }
  if(kind==="level"){
    const m = pick(MATS), s = pick(m[L].s); if(!s) return null;
    const names = T().lvl, icon = {h:"⛔",m:"⚠️",l:"ℹ️"};
    const lab = k => `${icon[k]} ${names[k]}`;
    return {kind, L, prompt:t("qLevel"), fact:`${m.e} ${esc(m[L].n)}: “${esc(s[1])}”`, opts:["h","m","l"].map(lab), ans:lab(s[0]), explain:lab(s[0])};
  }
  if(kind==="high"){
    const highs = MATS.flatMap(m=>m[L].s.filter(s=>s[0]==="h").map(s=>({m,s})));
    const lows  = MATS.flatMap(m=>m[L].s.filter(s=>s[0]==="l").map(s=>({m,s})));
    if(!highs.length || lows.length<3) return null;
    const c = pick(highs), d = shuffle(lows.filter(x=>x.m.id!==c.m.id)).slice(0,3);
    const lab = x => `${x.m.e} ${x.s[1]}`;
    return {kind, L, prompt:t("qHigh"), fact:"", opts:shuffle([lab(c),...d.map(lab)]), ans:lab(c), explain:lab(c)};
  }
  return null;
}

function answerQ(i){
  if(QZ.done) return;
  QZ.done = true; QZ.picked = i;
  const ok = QZ.opts[i]===QZ.ans;
  PL.answered++;
  if(ok){
    const bonus = upVal("streak")*Math.min(PL.streak,10);
    QZ.gain = upVal("per") + bonus; QZ.bonus = bonus;
    PL.pts += QZ.gain; PL.streak++; PL.correct++;
  } else {
    QZ.loss = Math.min(PL.pts, upVal("shield")); PL.pts -= QZ.loss; PL.streak = 0;
  }
  QZ.ok = ok; savePL(); renderPlay();
  $("#qNext")?.focus();
  announce($("#qFb")?.innerText||"");
}
function showFeedback(){
  $$("#quizBox .qopt").forEach((b,i)=>{ b.disabled=true; if(QZ.opts[i]===QZ.ans) b.classList.add("right"); if(i===QZ.picked) b.classList.add("picked"); });
  const fb = $("#qFb");
  fb.innerHTML = QZ.ok
    ? `<div class="qfb ok"><span class="emo pop" aria-hidden="true">🎉</span><div class="grow">${t("qRight",{p:QZ.gain})}${QZ.bonus?` <small>${t("qStreakB",{b:QZ.bonus})}</small>`:""}<small>${esc(QZ.explain)}</small></div><button class="btn" type="button" id="qNext">${t("qNext")} →</button></div>`
    : `<div class="qfb no"><span class="emo" aria-hidden="true">🙈</span><div class="grow">${t("qWrong")}${QZ.loss?` (${t("qPen",{p:QZ.loss})})`:""}<small>${esc(t("qAns",{a:QZ.explain}))}</small></div><button class="btn" type="button" id="qNext">${t("qNext")} →</button></div>`;
  $("#qNext").onclick=()=>{ QZ = makeQuestion(); renderPlay(); $("#qP")?.focus?.(); $$("#quizBox .qopt")[0]?.focus(); };
}
function buyUp(k){
  const u=UPS[k], lv=PL.up[k]; if(lv>=u.vals.length-1) return;
  const cost=u.costs[lv+1]; if(PL.pts<cost) return;
  PL.pts-=cost; PL.up[k]++; savePL(); renderPlay();
  announce(t("bought",{x:t(UPK[k][0])})); $(`[data-up="${k}"]`)?.focus();
}
document.addEventListener("keydown", e=>{
  if($("#page-play").hidden || e.ctrlKey || e.metaKey || e.altKey) return;

  else if(G.mode==="hub" && QZ && !QZ.done && n<=QZ.opts.length){ e.preventDefault(); answerQ(n-1); }
});

  if(PL.pts<GAME_COST) return;
  PL.pts-=GAME_COST; savePL();
  G = {mode:"play", score:0, lives:3, speed:.2, y:0, item:null, paused:false, last:0, msg:null, raf:0, lastItem:null};
  nextItem(); renderPlay(); loop();
  $("#page-play").scrollIntoView({behavior:reduceMotion()?"auto":"smooth",block:"start"});
}
function nextItem(){
  let it; do{ it = pick(GITEMS); } while(GITEMS.length>1 && it===G.lastItem);
  G.item = it; G.lastItem = it; G.y = 0;
  if(prefs.read) Reader.say(t("gItem",{x:giName(it)}), null);
}
function renderGame(){
  $("#page-play").innerHTML = `<section class="panel" aria-labelledby="gT2" data-noread>
    <div class="ghud">
      <h2 id="gT2" style="margin:0" class="grow"><span class="emo" aria-hidden="true">🗑️</span> ${t("gTitle")}</h2>
      <span class="chip">${t("gScore")}: <span id="gScore">${G.score}</span></span>
      <span class="chip" aria-label="${t("gLives")}: ${G.lives}" id="gLives">${"❤️".repeat(G.lives)}${"🤍".repeat(3-G.lives)}</span>
      <button class="btn ghost" type="button" id="gPause">${G.paused?"▶ "+t("gResume"):"⏸ "+t("gPause")}</button>
      <button class="btn ghost" type="button" id="gQuit">${t("gQuit")}</button>
    </div>
    <div class="arena" id="arena">
      <div class="fall" id="fall"><span class="emo" aria-hidden="true">${G.item[0]}</span><span>${esc(giName(G.item))}</span></div>
      <div class="gmsg" id="gMsg" hidden></div>
      <div class="ground" aria-hidden="true"></div>
    </div>
    <p class="sr" aria-live="assertive" id="gLive"></p>
    <div class="bins">${BINS.map(([k,e,l],i)=>`<button type="button" class="bin ${k}" data-bin="${k}"><span class="emo" aria-hidden="true">${e}</span>${t(l)}<small aria-hidden="true">${i+1}</small></button>`).join("")}</div>
    <p class="muted" style="margin:10px 0 0;font-size:.9rem">${t("gKeys")}</p>
  </section>`;
  $$("[data-bin]").forEach(b=>b.onclick=()=>sortInto(b.dataset.bin));
  $("#gPause").onclick=togglePause;
  $("#gQuit").onclick=()=>endGame();
  $("#gLive").textContent = t("gItem",{x:giName(G.item)});
  if(G.paused) showMsg(t("gPaused"), "ok", true);
  placeItem();
}
function placeItem(){
  const a=$("#arena"), f=$("#fall"); if(!a||!f) return;
  const max = a.clientHeight - f.offsetHeight - 12;
  f.style.transform = `translate(-50%, ${Math.max(0,G.y*max)}px)`;
}
function loop(){
  cancelAnimationFrame(G.raf);
  G.last = performance.now();
  const step = now => {
    if(G.mode!=="play") return;
    const dt = Math.min(.05,(now-G.last)/1000); G.last = now;
    if(!G.paused){
      G.y += G.speed*dt;
      if(G.y>=1){ miss(); }
      placeItem();
    }
    G.raf = requestAnimationFrame(step);
  };
  G.raf = requestAnimationFrame(step);
}
function showMsg(text, cls, sticky){
  const m=$("#gMsg"); if(!m) return;
  m.textContent=text; m.className="gmsg "+cls; m.hidden=false;
  clearTimeout(G.msgT); if(!sticky) G.msgT=setTimeout(()=>{ if(m.isConnected) m.hidden=true; },1400);
}
function updHud(){
  $("#gScore") && ($("#gScore").textContent=G.score);
  const l=$("#gLives"); if(l){ l.textContent="❤️".repeat(G.lives)+"🤍".repeat(3-G.lives); l.setAttribute("aria-label",`${t("gLives")}: ${G.lives}`); }
}
function sortInto(bin){
  if(G.mode!=="play" || G.paused) return;
  const it=G.item;
  if(bin===it[3]){ G.score++; G.speed=Math.min(.6,G.speed+.012); showMsg(t("gRight"),"ok"); }
  else { G.lives--; showMsg(t("gWrongBin",{x:giName(it),b:binName(it[3])}),"no"); }
  afterSort();
}
function miss(){
  const it=G.item; G.lives--;
  showMsg(t("gMissed",{x:giName(it),b:binName(it[3])}),"no"); afterSort();
}
function afterSort(){
  updHud();
  if(G.lives<=0){ endGame(); return; }
  nextItem();
  const f=$("#fall"); if(f) f.innerHTML=`<span class="emo" aria-hidden="true">${G.item[0]}</span><span>${esc(giName(G.item))}</span>`;
  const msg=$("#gMsg")?.textContent||"";
  $("#gLive") && ($("#gLive").textContent = msg+" "+t("gItem",{x:giName(G.item)}));
}
function togglePause(){
  if(G.mode!=="play") return;
  G.paused=!G.paused;
  $("#gPause").textContent = G.paused?"▶ "+t("gResume"):"⏸ "+t("gPause");
  if(G.paused) showMsg(t("gPaused"),"ok",true); else { $("#gMsg").hidden=true; G.last=performance.now(); }
}
function endGame(){
  cancelAnimationFrame(G.raf);
  const earned = G.score*GAME_REWARD, isBest = G.score>PL.best;
  PL.pts += earned; if(isBest) PL.best=G.score; savePL();
  G = {mode:"over", score:G.score, earned, isBest};
  renderPlay();
  $("#goAgain")?.focus() || $("#goBack")?.focus();
}
function renderOver(){
  const can = PL.pts>=GAME_COST;
  $("#page-play").innerHTML = `<section class="panel gover" aria-labelledby="goT">
    <h2 id="goT">${t("gOver")}</h2>
    <div class="big"><span class="emo" aria-hidden="true">🗑️</span> ${G.score}</div>
    <p>${t("gSorted",{s:G.score,p:G.earned})}</p>
    ${G.isBest?`<p class="pop" style="font-weight:700;color:var(--accent-text)">🏆 ${t("gNew")}</p>`:""}
    <p class="muted">🪙 ${PL.pts} ${t("ptsLabel")}</p>
    <div class="ctrls">
      ${can?`<button class="btn" type="button" id="goAgain">🎮 ${t("gAgain",{c:GAME_COST})}</button>`:""}
      <button class="btn ghost" type="button" id="goBack">${t("gBack")}</button>
    </div></section>`;
  $("#goAgain") && ($("#goAgain").onclick=startGame);
  $("#goBack").onclick=()=>{ G={mode:"hub"}; renderPlay(); };
  announce(t("gOver")+" "+t("gSorted",{s:G.score,p:G.earned}));
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && G.mode==="play" && !G.paused) togglePause(); });

/* ===== START ===== */
applyPrefs(); drawGrid();
if(canSpeak) speechSynthesis.getVoices();
</script>
</body>
</html>
